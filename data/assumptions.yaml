  base_id: S3 # comparison
  reference_id: S3 # "ground truth"
  use_batch_adjustment: true

group1_basis:
  yield_basis: formula
  wet_kg_per_day: 10
  ts_fraction: 0.25
  vs_of_ts: 0.90
  reactor_m3: 1.0
  olr_ov erides:
    S9: 4.5
  status: confirmed
  source: "Group 1 main.py, https://github.com/PTwo22/ADM1-simulation"

chp:
  thermal_efficiency: 0.45 # assume engine heat captured will need to be tuned
  own_use_fraction: 0.10 # plant own electricity use, share of gross
  status: "placeholder"
  source: "need an engine sheet"

heat_recovery:
  usable_fraction: 0.70 # share of recovered heat farm use
  boiler_efficiency: 0.85 #efficiency of heater it replace
  status: placeholder
  source: "need digester heating demand and on-form heat use"

energy_value:
  electricity_avoided: 0.34 #$/Kwh the farm stop playing
  electricity_export: 0.12 #$/Kwh the exported electricity
  self_use_fraction: 0.80 #share electricity used in site
  heat_fuel_price: 0.06 #$k/wh of fuel the recovered heat displaces

emissions: 
