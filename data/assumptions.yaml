    food_waste: 500
    # scg: 80
    # oil: 400

  operating_days_per_year: 360
  status: "testing"
  source: "ASK group 1 / for farm tonnage, composition and operating days"

compositions:
  "All food waste":
    food_waste : 500
  "Carbohydrate-heavy":
    food_waste: 50
    rice: 450
    scg: 0
  "With oil":
    food_waste: 450
    oil: 50
